name: Build chineserd-app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Upload private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chineserd-app-dist
          path: dist/
          retention-days: 14
